[package]
name = "nitya-node"
description = "The nitya node on each machine: agent context, notifications, file sync (ADR-0001)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nitya-node"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ed25519-dalek = "2"
nitya-audit = { path = "../audit" }
nitya-device = { path = "../device" }
nitya-keys = { path = "../keys" }
nitya-proto = { path = "../proto" }
nitya-tailnet = { path = "../tailnet" }
prost = "0.14.4"
rpassword = "7"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.6"
