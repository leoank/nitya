[package]
name = "nitya-server"
description = "The nitya server: store, sync, policy, audit (ADR-0001)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nitya-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
cedar-policy = "4.15.0"
ed25519-dalek = "2"
nitya-audit = { path = "../audit" }
nitya-device = { path = "../device" }
nitya-keys = { path = "../keys" }
nitya-proto = { path = "../proto" }
nitya-store = { path = "../store" }
nitya-tailnet = { path = "../tailnet" }
prost = "0.14.4"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tonic = "0.14.6"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
age = "0.11"
tempfile = "3.27.0"
