[package]
name = "nitya-server"
description = "The nitya server: store, sync, policy, audit (ADR-0001)"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nitya-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ed25519-dalek = "2"
nitya-device = { path = "../device" }
nitya-proto = { path = "../proto" }
nitya-tailnet = { path = "../tailnet" }
prost = "0.14.4"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.6"

[dev-dependencies]
tempfile = "3.27.0"
